<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ije device targets</title>
    <style>
      :root {
        --yoyo-primary: #7c3aed;
        --yoyo-foreground: #1b1b25;
        --yoyo-muted: #6b6b7b;
        --yoyo-border: #e4e4ec;
        --yoyo-card-bg: #ffffff;
        --yoyo-font: system-ui, sans-serif;
      }
      body { font-family: var(--yoyo-font); margin: 0; padding: 24px 16px; background: #f6f5f8; color: var(--yoyo-foreground); }
      main { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
      form { display: flex; flex-wrap: wrap; gap: 8px; }
      input { font: inherit; padding: 6px 8px; min-width: 0; flex: 1 1 140px; }
      #log { font-size: 12px; color: var(--yoyo-muted); white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 18px; margin: 0">Device targets</h1>
      <form id="connect-form">
        <input id="api-url" value="http://localhost:8080/api/v1" aria-label="API URL" />
        <input id="api-key" type="password" placeholder="YOYO_API_KEY" aria-label="API key" />
        <input id="device-id" placeholder="Device id" aria-label="Device id" />
        <button type="submit">Show</button>
      </form>
      <div id="targets"></div>
      <div id="log" role="log"></div>
    </main>
    <script type="module" src="./src/targets.ts"></script>
  </body>
</html>
